name: Upgrade Check

on:
  workflow_dispatch:  # Ручной запуск
  schedule:
    # Запускать каждый понедельник в 9:00 UTC
    - cron: '0 9 * * 1'

jobs:
  check-upstream:
    name: Check for upstream updates
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
    - name: Add upstream remote
      run: |
        git remote add upstream-check https://github.com/element-hq/element-x-ios.git || true
        
    - name: Fetch upstream
      run: git fetch upstream-check
        
    - name: Check for updates
      id: check
      run: |
        CURRENT_COMMIT=$(git rev-parse HEAD)
        UPSTREAM_COMMIT=$(git rev-parse upstream-check/develop)
        
        echo "Current commit: $CURRENT_COMMIT"
        echo "Upstream commit: $UPSTREAM_COMMIT"
        
        if [ "$CURRENT_COMMIT" != "$UPSTREAM_COMMIT" ]; then
          echo "updates_available=true" >> $GITHUB_OUTPUT
          echo "Updates available!"
          echo "Run ./scripts/upgrade/sync-from-upstream.sh to update"
        else
          echo "updates_available=false" >> $GITHUB_OUTPUT
          echo "Already up to date"
        fi
        
    - name: Create Issue if updates available
      if: steps.check.outputs.updates_available == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['upgrade-available']
          });
          
          // Check if issue already exists
          const existingIssue = issues.find(issue => 
            issue.title.includes('Upstream updates available')
          );
          
          if (!existingIssue) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚀 Upstream updates available from element-x-ios',
              body: `New updates are available from upstream repository.\n\n` +
                    `**How to update:**\n` +
                    `1. Run \`./scripts/upgrade/sync-from-upstream.sh\`\n` +
                    `2. Review changes\n` +
                    `3. Run tests\n` +
                    `4. Create PR to develop\n\n` +
                    `*This issue was automatically generated by GitHub Actions*`,
              labels: ['upgrade-available', 'automated']
            });
          }
